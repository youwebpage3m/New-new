
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cosmic Message 🌌</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: Arial, sans-serif;
  color: white;
  background: #030316;
}

/* Space Canvas */
canvas {
  position: fixed;
  inset: 0;
  z-index: 0;
}

/* Colorful Nebula */
.nebula {
  position: fixed;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  filter: blur(100px);
  opacity: 0.3;
  animation: moveNebula 15s infinite alternate;
}

.n1 {
  background: #7200ff;
  top: -200px;
  left: -150px;
}

.n2 {
  background: #00d9ff;
  right: -200px;
  bottom: -150px;
  animation-delay: -5s;
}

.n3 {
  background: #ff009d;
  top: 40%;
  left: 35%;
  animation-delay: -10s;
}

/* Main Container */
.container {
  position: relative;
  z-index: 2;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

/* Glass Card */
.card {
  width: 900px;
  max-width: 95%;
  min-height: 450px;
  padding: 60px 30px;
  text-align: center;
  border-radius: 30px;
  border: 1px solid rgba(255,255,255,0.25);
  background: rgba(255,255,255,0.08);
  backdrop-filter: blur(18px);
  box-shadow: 0 0 60px rgba(110,70,255,0.3);
  animation: appear 1.5s ease;
  transition: transform 0.2s ease;
}

/* Badge */
.badge {
  display: inline-block;
  padding: 10px 20px;
  border: 1px solid #8c72ff;
  border-radius: 30px;
  color: #d4c8ff;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

.badge::before {
  content: "● ";
  color: #55ffcb;
}

/* Main Heading */
h1 {
  font-size: clamp(35px, 7vw, 85px);
  line-height: 1.2;
  background: linear-gradient(
    90deg,
    #ffffff,
    #b78cff,
    #54eaff,
    #ff91d5,
    #ffffff
  );
  background-size: 300%;
  -webkit-background-clip: text;
  color: transparent;
  animation: gradient 6s linear infinite;
}

/* Subtitle */
.subtitle {
  margin: 25px auto;
  max-width: 600px;
  color: #d4d2ec;
  font-size: 17px;
  line-height: 1.7;
}

/* Planet */
.orbit {
  width: 170px;
  height: 80px;
  margin: 30px auto;
  position: relative;
}

.planet {
  width: 55px;
  height: 55px;
  position: absolute;
  top: 12px;
  left: 57px;
  border-radius: 50%;
  background: radial-gradient(
    circle at 30% 25%,
    white,
    #9870ff 20%,
    #3b168f 60%,
    #100022
  );
  box-shadow: 0 0 30px #855cff,
              0 0 70px #4c27bc;
  animation: float 4s ease-in-out infinite;
}

.ring {
  position: absolute;
  top: 15px;
  left: 25px;
  width: 120px;
  height: 45px;
  border: 2px solid #6deeff;
  border-radius: 50%;
  transform: rotate(-20deg);
  box-shadow: 0 0 15px #00cfff;
}

/* Button */
button {
  padding: 14px 28px;
  border: 1px solid #a18bff;
  border-radius: 30px;
  color: white;
  background: linear-gradient(
    90deg,
    #6339b8,
    #096d9b
  );
  cursor: pointer;
  font-size: 15px;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.08);
  box-shadow: 0 0 30px #7655ff;
}

/* Animations */
@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(40px) scale(0.9);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}

@keyframes gradient {
  to {
    background-position: 300%;
  }
}

@keyframes moveNebula {
  from {
    transform: translate(0, 0) scale(1);
  }
  to {
    transform: translate(100px, 80px) scale(1.3);
  }
}

@keyframes float {
  50% {
    transform: translateY(-10px);
  }
}

/* Mobile */
@media (max-width: 600px) {
  .card {
    padding: 45px 20px;
    min-height: 430px;
  }

  .subtitle {
    font-size: 14px;
  }
}
</style>
</head>

<body>

<canvas id="space"></canvas>

<div class="nebula n1"></div>
<div class="nebula n2"></div>
<div class="nebula n3"></div>

<div class="container">
  <div class="card" id="card">

    <div class="badge">COSMIC TRANSMISSION</div>

    <h1>
      Esha Rajput ji<br>
    apne bare mai bhi batao kafi intresting ho 
    aap
    </h1>

    <p class="subtitle">
      अपने बारे में बताओ .<br>
      बताओ बताओ बताओ 🌌
    </p>

    <div class="orbit">
      <div class="planet"></div>
      <div class="ring"></div>
    </div>

    <button id="warpBtn">
      ✨ Enter the Cosmos
    </button>

  </div>
</div>

<script>
// =============================
// STARFIELD ANIMATION
// =============================

const canvas = document.getElementById("space");
const ctx = canvas.getContext("2d");

let stars = [];
let width, height;
let warp = false;

function resize() {
  width = canvas.width = window.innerWidth;
  height = canvas.height = window.innerHeight;

  stars = [];

  for (let i = 0; i < 250; i++) {
    stars.push({
      x: Math.random() * width,
      y: Math.random() * height,
      size: Math.random() * 2,
      speed: Math.random() * 0.5 + 0.1,
      opacity: Math.random()
    });
  }
}

function animateStars() {
  ctx.clearRect(0, 0, width, height);

  stars.forEach(star => {
    star.y += warp ? star.speed * 8 : star.speed;

    if (star.y > height) {
      star.y = 0;
      star.x = Math.random() * width;
    }

    ctx.beginPath();
    ctx.fillStyle =
      `rgba(255,255,255,${star.opacity})`;

    ctx.arc(
      star.x,
      star.y,
      star.size,
      0,
      Math.PI * 2
    );

    ctx.fill();

    if (warp) {
      ctx.beginPath();
      ctx.strokeStyle = "rgba(130,180,255,0.3)";
      ctx.moveTo(star.x, star.y);
      ctx.lineTo(star.x, star.y - 12);
      ctx.stroke();
    }
  });

  requestAnimationFrame(animateStars);
}

resize();
animateStars();

window.addEventListener("resize", resize);

// =============================
// 3D MOUSE EFFECT
// =============================

const card = document.getElementById("card");

document.addEventListener("mousemove", event => {
  const x = (event.clientX / window.innerWidth - 0.5) * 10;
  const y = (event.clientY / window.innerHeight - 0.5) * -10;

  card.style.transform =
    `rotateY(${x}deg) rotateX(${y}deg)`;
});

document.addEventListener("mouseleave", () => {
  card.style.transform = "rotateY(0deg) rotateX(0deg)";
});

// =============================
// WARP BUTTON
// =============================

const warpBtn = document.getElementById("warpBtn");

warpBtn.addEventListener("click", () => {
  warp = !warp;

  if (warp) {
    warpBtn.innerHTML = "🌠 Warp Mode ON";
  } else {
    warpBtn.innerHTML = "✨ Enter the Cosmos";
  }
});
</script>

</body>
</html>
